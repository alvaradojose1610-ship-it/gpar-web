<!-- Hero con video (v3, aprobado por el cliente) — reemplaza la versión con foto + velo.
Video vertical 9:16 a la derecha (completo, sin recorte) + el mismo video desenfocado y oscurecido de fondo.
Sonido: los navegadores bloquean autoplay con audio. Se intenta con sonido; si falla, arranca en mute
y se activa con el primer clic en la página (fuera de botones) o con el botón "Activar sonido".
Archivo: assets/video/hero-gpar.mp4 → servir desde /public/video/hero-gpar.mp4
Ver HANDOFF-CAMBIOS-2026-11.md
-->
<section class="hero-video">
  <video class="hero-video__bg" src="/video/hero-gpar.mp4" muted loop playsinline autoplay aria-hidden="true"></video>
  <div class="hero-video__inner">
    <div class="hero-video__copy">
      <div class="hero-video__kicker"><span class="hero-video__rule"></span>Soluciones para la industria</div>
      <h1 class="hero-video__title">
        <span class="t1">Todo en</span>
        <span class="t2">Transmisión</span>
        <span class="t3">de potencia mecánica</span>
      </h1>
      <p>Rodamientos, correas, chumaceras, motores, mangueras y repuestos de carga pesada. Arma tu lista y te cotizamos con precio, disponibilidad y tiempo de entrega.</p>
      <div class="hero-video__actions">
        <a class="hv-btn hv-btn--primary" href="/cotizar">Solicitar cotización</a>
        <a class="hv-btn hv-btn--ghost" href="#catalogo">Ver el catálogo</a>
      </div>
    </div>
    <div class="hero-video__player">
      <video id="heroMain" src="/video/hero-gpar.mp4" loop playsinline preload="auto"></video>
      <button type="button" id="heroSound" class="hero-video__sound" aria-pressed="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>
        <span>Activar sonido</span>
      </button>
    </div>
  </div>
</section>

<style>
.hero-video{position:relative;overflow:hidden;background:#07090C;height:clamp(560px,calc(100vh - 130px),900px)}
.hero-video__bg{position:absolute;inset:-40px;width:calc(100% + 80px);height:calc(100% + 80px);object-fit:cover;filter:blur(36px) brightness(.35);pointer-events:none}
.hero-video__inner{position:relative;height:100%;max-width:1680px;margin:0 auto;display:flex;align-items:center;gap:clamp(24px,4vw,72px);padding-left:clamp(20px,2.4vw,40px)}
.hero-video__copy{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;padding:clamp(40px,5vw,80px) 0;color:#fff}
.hero-video__kicker{display:flex;align-items:center;gap:16px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:clamp(15px,1.25vw,22px);letter-spacing:.32em;text-transform:uppercase}
.hero-video__rule{width:46px;height:3px;background:#F57C00}
.hero-video__title{margin:clamp(20px,2vw,34px) 0 0;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;line-height:.92;display:flex;flex-direction:column}
.hero-video__title .t1{font-weight:300;font-size:clamp(40px,4.4vw,84px);letter-spacing:.02em}
.hero-video__title .t2{font-weight:800;font-size:clamp(54px,6.8vw,128px)}
.hero-video__title .t3{font-weight:800;font-size:clamp(36px,4.1vw,78px);color:#F57C00}
.hero-video__copy p{margin:clamp(22px,2.2vw,38px) 0 0;max-width:44ch;font-size:clamp(16px,1.3vw,23px);line-height:1.6;text-wrap:pretty}
.hero-video__actions{margin-top:clamp(26px,2.4vw,42px);display:flex;gap:18px;flex-wrap:wrap}
.hv-btn{font-size:clamp(15px,1vw,19px);font-weight:700;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;text-decoration:none}
.hv-btn--primary{background:#F57C00;color:#1D2430;padding:clamp(16px,1.2vw,22px) clamp(26px,2.2vw,42px)}
.hv-btn--ghost{border:2px solid #fff;color:#fff;padding:clamp(14px,1.1vw,20px) clamp(24px,2.1vw,40px)}
.hv-btn--ghost:hover{background:#fff;color:#1D2430}
.hero-video__player{position:relative;height:100%;aspect-ratio:9/16;flex-shrink:0;border-left:4px solid #F57C00}
.hero-video__player video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
.hero-video__sound{position:absolute;right:16px;bottom:16px;display:flex;align-items:center;gap:10px;border:0;background:#fff;color:#1D2430;font:700 15px 'IBM Plex Sans',sans-serif;padding:12px 16px;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.4)}
/* Mobile: video arriba a ancho completo, texto debajo (pendiente de validar con el cliente) */
@media (max-width:820px){
  .hero-video{height:auto}
  .hero-video__inner{flex-direction:column-reverse;padding:0;gap:0}
  .hero-video__player{width:100%;height:auto;max-height:80vh;border-left:0;border-bottom:4px solid #F57C00}
  .hero-video__copy{padding:40px 20px 48px}
}
</style>

<script>
(() => {
  const v = document.getElementById('heroMain');
  const btn = document.getElementById('heroSound');
  const label = btn.querySelector('span');
  const set = (on) => {
    v.muted = !on; if (on) v.play().catch(() => {});
    label.textContent = on ? 'Silenciar' : 'Activar sonido';
    btn.setAttribute('aria-pressed', String(on));
  };
  v.muted = false;
  v.play().then(() => set(true)).catch(() => { v.muted = true; v.play().catch(() => {}); });
  btn.addEventListener('click', () => set(v.muted));
  const first = (e) => {
    document.removeEventListener('pointerdown', first, true);
    if (e.target.closest('button')) return;
    if (v.muted) set(true);
  };
  document.addEventListener('pointerdown', first, true);
})();
</script>
